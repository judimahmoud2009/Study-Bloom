<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Study Space</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="about.css" />
    <link rel="stylesheet" href="mind.css" />
    <link rel="stylesheet" href="profile.css" />
  </head>
  <body class="study">
    <!-- nav bar-->
    <nav class="greenbar">
      <img src="assests\handPlant.png" class="handPlant" alt="plant" />

      <div class="greenLinks">
        <a href="index.html">Home</a>
        <a href="study.html">Study Space</a>
        <a href="mind.html">Mind Garden</a>
        <a href="about.html">About Us</a>
        <a href="profile.html">Profile</a>
      </div>
      <img src="assests\StudyPlant.png" class="StudyPlant" alt="Plant" />
    </nav>
    <!-- text-->
    <h1>Study Space</h1>

    <p class="subtitle">Plan your work. Get things done. Stay focused.</p>

    <!-- to do list-->
    <div class="todo">
      <h2>To-Do List:</h2>
      <div class="addTask">
        <input type="text" id="taskInput" placeholder="Add a task..." />
        <button onclick="addTask()">+</button>
      </div>
      <div id="taskList"></div>
    </div>
    <!-- focus timer-->
    <div class="timer">
      <h2>Focus Timer:</h2>
      <video id="timerVideo" controls>
        <source src="assests\timer.mp4" type="video/mp4" />
      </video>
    </div>
    <!-- Calendar and reminder-->
    <div class="calendar">
      <h2>Calendar:</h2>
      <img src="assests\calendar.jpg" alt="Calendar" />

      <div class="reminderBox">
        <input type="text" id="reminderInput" placeholder="Add a reminder..." />
        <button class="reminderButton" onclick="addReminder()">+</button>

        <div id="reminders"></div>
      </div>
    </div>
    <!-- Progress -->
    <div class="progress">
      <h2>Progress:</h2>

      <div class="progressInfo">
        <div>
          <p>Tasks completed</p>
          <p id="taskProgress">0/0</p>
        </div>

        <div>
          <p>Study time</p>
          <p id="studyTime">0h 0m</p>
        </div>

        <div>
          <p>Study streak</p>
          <p>1 days🔥</p>
        </div>
        <img src="assests/StudyPlant.png" class="progressPlant" alt="Plant" />
      </div>
    </div>
    <script src="index.mjs"></script>
    <!--Adds spotify playlist-->
    <div class="spotify">
      <iframe
        data-testid="embed-iframe"
        style="border-radius: 12px"
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DX1s9knjP51Oa?utm_source=generator&si=9473aa937c7b469c"
        width="100%"
        height="352"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
      ></iframe>
    </div>
  </body>
</html>
